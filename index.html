<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITTA - Login</title>
    <link rel="stylesheet" href="css/style.css?v=3">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--white);
        }
        
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            text-align: center;
        }

        .login-card {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: 16px;
            padding: 32px;
            box-shadow: var(--shadow-soft);
            text-align: left;
            margin-top: 0;
        }

        .login-logo {
            max-width: 100px;
            margin: 0 auto 1.5rem auto;
            display: block;
        }

        .login-header {
            margin-bottom: 2rem;
            text-align: left;
        }

        .login-header h1 {
            font-size: 1.85rem;
            margin-bottom: 0.25rem;
            letter-spacing: -0.025em;
        }

        .login-header p {
            color: var(--gray-600);
            font-size: 0.95rem;
        }

        .login-footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.875rem;
        }

        .login-footer a {
            color: var(--ut-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .error-message {
            background-color: #FEE2E2;
            color: var(--danger);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            display: none;
            text-align: center;
            border: 1px solid #FCA5A5;
            animation: fadeIn 0.3s ease-out;
        }
        
        .forgot-link {
            display: block;
            text-align: right;
            margin-top: -0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            color: var(--ut-blue);
            text-decoration: none;
            font-weight: 500;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: var(--gray-300);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--gray-200);
        }

        .divider:not(:empty)::before {
            margin-right: 1rem;
        }

        .divider:not(:empty)::after {
            margin-left: 1rem;
        }

        .btn-google {
            background-color: var(--white);
            color: var(--gray-800);
            border: 1px solid var(--gray-200);
            width: 100%;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .btn-google:hover {
            background-color: var(--gray-50);
            border-color: var(--gray-300);
        }

        .login-copyright {
            margin-top: 2.5rem;
            color: var(--gray-600);
            font-size: 0.75rem;
            text-align: center;
        }

        .login-header-centered {
            text-align: center;
        }

        .btn-full-width {
            width: 100%;
        }

        .modal-description {
            margin: 1rem 0;
            color: var(--gray-600);
            font-size: 0.9rem;
        }

        .register-form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }

        .form-group-no-margin {
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="login-container fade-in">
        <div class="login-card">
            <img src="assets/logo-ut.png" alt="Logo UT" class="login-logo">
            <div class="login-header login-header-centered">
                <h1>SITTA</h1>
                <p>Universitas Terbuka</p>
            </div>

            <div id="errorMessage" class="error-message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="admin@ut.ac.id" required>
                </div>
                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                        <label for="password" style="margin-bottom: 0;">Password</label>
                        <a href="#" class="forgot-link" onclick="openModal('forgotModal')" style="margin: 0;">Lupa password?</a>
                    </div>
                    <input type="password" id="password" class="form-control" placeholder="********" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-full-width">Masuk</button>
            </form>


            <div class="login-footer">
                <p>Belum punya akun? <a href="#" onclick="openModal('registerModal')">Daftar Gratis</a></p>
            </div>
        </div>
        
        <p class="login-copyright">© 2026 Universitas Terbuka. Semua Hak Dilindungi.</p>
    </div>

    <!-- Modals -->
    <div id="forgotModal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('forgotModal')">&times;</span>
            <h2>Reset Password</h2>
            <p class="modal-description">Masukkan email Anda untuk menerima instruksi reset password.</p>
            <div class="form-group">
                <label>Email Terdaftar</label>
                <input type="email" class="form-control" placeholder="nama@email.com">
            </div>
            <button type="button" class="btn btn-primary btn-full-width" onclick="alert('Instruksi telah dikirim!'); closeModal('forgotModal')">Kirim Instruksi</button>
        </div>
    </div>

    <div id="registerModal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('registerModal')">&times;</span>
            <h2>Pendaftaran Akun</h2>
            <div class="register-form-grid">
                <div class="form-group form-group-no-margin">
                    <label>Nama Lengkap</label>
                    <input type="text" class="form-control" placeholder="Nama Anda">
                </div>
                <div class="form-group form-group-no-margin">
                    <label>Email</label>
                    <input type="email" class="form-control" placeholder="email@ut.ac.id">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control" placeholder="********">
                </div>
            </div>
            <button type="button" class="btn btn-primary btn-full-width" onclick="alert('Pendaftaran berhasil! Silakan login.');">Daftar Sekarang</button>
        </div>
    </div>

    <script src="js/data.js?v=3"></script>
    <script src="js/script.js?v=3"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            if (email === "admin@ut.ac.id" && password === "123456") {
                localStorage.setItem('user', JSON.stringify({ name: "Admin UT", email: email }));
                window.location.href = "dashboard.html";
            } else {
                errorDiv.textContent = "Email/password yang anda masukkan salah";
                errorDiv.style.display = "block";
                setTimeout(() => { errorDiv.style.display = "none"; }, 3000);
            }
        });
    </script>
</body>
</html>
